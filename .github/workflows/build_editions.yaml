name: iso_build
on:
  workflow_dispatch:
  schedule:
    - cron:  '30 6 1 * *'

jobs:
  prepare-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - id: time
        uses: nanzm/get-time-action@887e4db9af58ebae64998b7105921b816af77977 # v2.0
        with:
          format: 'YYYYMMDDHHmm'
    outputs:
      release_tag: ${{ steps.time.outputs.time }}      
  release:
    runs-on: ubuntu-26.04
    needs: prepare-release    
    strategy:
      matrix:
        ##### EDIT ME #####
        EDITION: [i3, cinnamon]
        KERNEL: [linux618]
        BRANCH: [stable]
        SCOPE: [minimal,full]
        ###################
    steps:
      - uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - id: image-build
        uses: yochananmarqos/manjaro-iso-action@patch-2
        with:
          edition: ${{ matrix.edition }}
          branch: ${{ matrix.branch }}
          scope: ${{ matrix.scope }}
          version: "26.1.2"
          kernel: ${{ matrix.kernel }}
          code-name: "Bian-May"
          build-mirror: "https://mirrors.manjaro.org/repo"
          release-tag: ${{ needs.prepare-release.outputs.release_tag }}
      - name: rollback
        if: ${{ failure() || cancelled() }}
        run: |
          echo ${{ github.token }} | gh auth login --with-token
          gh release delete ${{ needs.prepare-release.outputs.release_tag }} -y --repo ${{ github.repository }}
          git push --delete origin ${{ needs.prepare-release.outputs.release_tag }}
